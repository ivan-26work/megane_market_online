<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vérification email - Megane Market</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 60px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1rem;
            color: #2e7d32;
        }

        .header-center {
            font-weight: 600;
            font-size: 0.85rem;
            color: #2e7d32;
        }

        .main-content {
            flex: 1;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .verify-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            animation: fadeIn 0.4s ease;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .verify-icon {
            width: 80px;
            height: 80px;
            background: #4ade80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .verify-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .verify-icon.warning {
            background: #ffaa44;
        }

        .verify-icon.error {
            background: #ff4d4d;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: #1a3a1a;
        }

        .message {
            font-size: 0.9rem;
            color: #2e7d32;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .info-box {
            background: rgba(255,255,255,0.4);
            border-radius: 16px;
            padding: 16px;
            margin: 20px 0;
            text-align: left;
        }

        .info-box h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box ul {
            list-style: none;
            padding: 0;
        }

        .info-box li {
            font-size: 0.8rem;
            color: #1a3a1a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-box li i {
            width: 20px;
            color: #4ade80;
            font-size: 0.8rem;
        }

        .email-display {
            background: rgba(255,255,255,0.4);
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: 600;
            margin: 20px 0;
            word-break: break-all;
            color: #1a3a1a;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            margin-bottom: 12px;
            border: none;
        }

        .btn-primary {
            background: #4ade80;
            color: #1a2a3a;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }

        .btn-primary:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.6);
            color: #1a3a1a;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }

        .btn-secondary:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2a3a;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #4ade80;
            color: #1a2a3a;
        }

        .toast.error {
            background: #ff4d4d;
        }

        @media (max-width: 600px) {
            .main-header {
                margin: 12px 12px 0 12px;
                padding: 0 15px;
            }
            .logo-text {
                display: none;
            }
            .verify-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="Megane Market" class="logo-img" onerror="this.src='https://placehold.co/36x36?text=MM'">
            <span class="logo-text">Megane Market</span>
        </a>
        <div class="header-center">Vérification email</div>
        <div style="width: 36px;"></div>
    </header>

    <main class="main-content">
        <div class="verify-card" id="verifyCard">
            <div id="iconArea" class="verify-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <h2 id="title">Vérification en cours</h2>
            <div id="message" class="message">Chargement...</div>
            <div id="emailDisplay" class="email-display" style="display: none;"></div>
            
            <div id="infoBox" class="info-box" style="display: none;">
                <h4><i class="fas fa-bell"></i> Pourquoi vérifier votre email ?</h4>
                <ul>
                    <li><i class="fas fa-check-circle"></i> Recevoir les confirmations de commande</li>
                    <li><i class="fas fa-check-circle"></i> Être informé des offres spéciales</li>
                    <li><i class="fas fa-check-circle"></i> Sécuriser votre compte Megane Market</li>
                    <li><i class="fas fa-check-circle"></i> Communiquer avec les vendeurs</li>
                </ul>
            </div>
            
            <div id="buttonArea"></div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            emailjs.init({ publicKey: "4TkvKRRbn9qDSIjG3" });
            
            const SERVICE_ID = "Megane_market";
            const TEMPLATE_ID = "template_ugz1f33";

            const iconArea = document.getElementById('iconArea');
            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');
            const emailDisplay = document.getElementById('emailDisplay');
            const infoBox = document.getElementById('infoBox');
            const buttonArea = document.getElementById('buttonArea');
            const toastEl = document.getElementById('toast');

            let currentUserId = null;
            let currentEmail = null;

            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = `toast ${type} show`;
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            }

            function setLoading(loading) {
                const btns = document.querySelectorAll('.btn');
                btns.forEach(btn => btn.disabled = loading);
            }

            function showSuccess(message, redirectUrl = null) {
                infoBox.style.display = 'none';
                iconArea.className = 'verify-icon';
                iconArea.innerHTML = '<i class="fas fa-check-circle"></i>';
                titleEl.textContent = 'Email vérifié !';
                messageEl.textContent = message;
                buttonArea.innerHTML = '<button id="redirectBtn" class="btn btn-primary">Accéder au marché</button>';
                document.getElementById('redirectBtn')?.addEventListener('click', () => {
                    window.location.href = redirectUrl || 'https://megane-market.online/market-new.html';
                });
            }

            function showError(message, showResend = true, email = null) {
                infoBox.style.display = 'block';
                iconArea.className = 'verify-icon error';
                iconArea.innerHTML = '<i class="fas fa-times-circle"></i>';
                titleEl.textContent = 'Vérification échouée';
                messageEl.textContent = message;
                
                if (showResend && email) {
                    buttonArea.innerHTML = `
                        <button id="resendBtn" class="btn btn-primary">Renvoyer l'email</button>
                        <button id="backBtn" class="btn btn-secondary">Retour à l'accueil</button>
                    `;
                    document.getElementById('resendBtn')?.addEventListener('click', () => resendVerification(email));
                    document.getElementById('backBtn')?.addEventListener('click', () => {
                        window.location.href = 'https://megane-market.online/index.html';
                    });
                } else if (showResend) {
                    buttonArea.innerHTML = `
                        <button id="backBtn" class="btn btn-primary">Retour à l'accueil</button>
                    `;
                    document.getElementById('backBtn')?.addEventListener('click', () => {
                        window.location.href = 'https://megane-market.online/index.html';
                    });
                }
            }

            function showResendForm() {
                infoBox.style.display = 'block';
                iconArea.className = 'verify-icon warning';
                iconArea.innerHTML = '<i class="fas fa-envelope"></i>';
                titleEl.textContent = 'Vérifiez votre email';
                messageEl.textContent = 'Pour profiter pleinement de Megane Market, vous devez vérifier votre adresse email.';
                
                if (currentEmail) {
                    emailDisplay.style.display = 'block';
                    emailDisplay.innerHTML = `<i class="fas fa-envelope"></i> ${currentEmail}`;
                }
                
                buttonArea.innerHTML = `
                    <button id="resendBtn" class="btn btn-primary">📧 Renvoyer l'email de vérification</button>
                    <button id="logoutBtn" class="btn btn-secondary">🔓 Se reconnecter</button>
                `;
                
                document.getElementById('resendBtn')?.addEventListener('click', async () => {
                    await resendVerification();
                });
                document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.href = 'https://megane-market.online/login.html';
                });
            }

            async function resendVerification(email = null) {
                setLoading(true);
                
                try {
                    let userEmail = email;
                    let userId = currentUserId;
                    
                    if (!userEmail || !userId) {
                        const { data: { session } } = await supabase.auth.getSession();
                        if (!session) {
                            showError('Vous devez être connecté', true);
                            setLoading(false);
                            return;
                        }
                        userId = session.user.id;
                        userEmail = session.user.email;
                    }
                    
                    const token = crypto.randomUUID();
                    const expiresAt = new Date();
                    expiresAt.setHours(expiresAt.getHours() + 24);
                    
                    await supabase
                        .from('email_verifications')
                        .delete()
                        .eq('user_id', userId);
                    
                    const { error: insertError } = await supabase
                        .from('email_verifications')
                        .insert({
                            user_id: userId,
                            email: userEmail,
                            token: token,
                            expires_at: expiresAt.toISOString(),
                            is_verified: false
                        });
                    
                    if (insertError) throw insertError;
                    
                    const verificationLink = `https://megane-market.online/email-verify.html?token=${token}`;
                    
                    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                        to_email: userEmail,
                        to_name: userEmail.split('@')[0],
                        message: `Bienvenue sur Megane Market !\n\nPour activer votre compte et accéder à toutes les fonctionnalités, veuillez vérifier votre adresse email en cliquant sur le lien ci-dessous :\n\n${verificationLink}\n\nCe lien expire dans 24 heures.\n\nÀ bientôt sur Megane Market !`,
                        subject: "Vérifiez votre email - Megane Market",
                        from_name: "Megane Market",
                        reply_to: "no-reply@megane-market.online",
                        image_url: "https://emcsigvlopntwbfkkjkh.supabase.co/storage/v1/object/public/buyers-avatars/20260518_150104.jpg",
                        button_url: verificationLink,
                        button_text: "Vérifier mon email"
                    });
                    
                    showToast('Email de vérification envoyé ! Vérifiez votre boîte', 'success');
                    
                    iconArea.className = 'verify-icon';
                    iconArea.innerHTML = '<i class="fas fa-paper-plane"></i>';
                    titleEl.textContent = 'Email envoyé !';
                    messageEl.innerHTML = `Un nouveau lien a été envoyé à <strong>${userEmail}</strong>. N'oubliez pas de vérifier vos spams.`;
                    buttonArea.innerHTML = '<button id="backBtn" class="btn btn-secondary">Retour à l\'accueil</button>';
                    document.getElementById('backBtn')?.addEventListener('click', () => {
                        window.location.href = 'https://megane-market.online/index.html';
                    });
                    
                } catch (err) {
                    console.error('Erreur renvoi:', err);
                    showError(`Erreur: ${err.message || 'Erreur inconnue'}`, true);
                } finally {
                    setLoading(false);
                }
            }

            async function verifyToken(token) {
                try {
                    const { data, error } = await supabase
                        .from('email_verifications')
                        .select('*')
                        .eq('token', token)
                        .single();
                    
                    if (error || !data) {
                        showError('Lien invalide.', true);
                        return false;
                    }
                    
                    const now = new Date();
                    const expiresAt = new Date(data.expires_at);
                    
                    if (expiresAt < now) {
                        showError('Ce lien a expiré. Veuillez en demander un nouveau.', true, data.email);
                        return false;
                    }
                    
                    if (data.is_verified === true) {
                        showSuccess('Votre email est déjà vérifié. Bienvenue !', 'https://megane-market.online/market-new.html');
                        return true;
                    }
                    
                    const { error: updateError } = await supabase
                        .from('email_verifications')
                        .update({ is_verified: true })
                        .eq('token', token);
                    
                    if (updateError) throw updateError;
                    
                    showSuccess('Email vérifié avec succès ! Vous allez être redirigé.', 'https://megane-market.online/market-new.html');
                    return true;
                    
                } catch (err) {
                    console.error('Erreur vérification:', err);
                    showError('Erreur lors de la vérification', true);
                    return false;
                }
            }

            async function checkIfAlreadyVerified() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return false;
                
                const { data, error } = await supabase
                    .from('email_verifications')
                    .select('is_verified')
                    .eq('user_id', session.user.id)
                    .single();
                
                if (error) return false;
                return data?.is_verified === true;
            }

            async function init() {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session) {
                    showError('Vous devez être connecté pour vérifier votre email', true);
                    return;
                }
                
                currentUserId = session.user.id;
                currentEmail = session.user.email;
                
                const alreadyVerified = await checkIfAlreadyVerified();
                if (alreadyVerified) {
                    showSuccess('Votre email est déjà vérifié. Bienvenue !', 'https://megane-market.online/market-new.html');
                    return;
                }
                
                if (token) {
                    await verifyToken(token);
                } else {
                    showResendForm();
                }
            }
            
            init();
        })();
    </script>
</body>
</html>
