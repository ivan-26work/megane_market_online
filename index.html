    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        /* HEADER NÉOMORPHIQUE VERT */
        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 70px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }
        .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; box-shadow: 3px 3px 6px #9bb8a8, -3px -3px 6px #f0fff4; }
        .header-center { font-weight: 800; font-size: 1.3rem; font-family: 'Poppins', sans-serif; color: #2e7d32; letter-spacing: 0.5px; text-align: center; flex: 1; }
        .status-badge {
            background: #e0e5ec;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }
        .status-badge.complet { background: #4ade80; color: #1a2a3a; }
        .status-badge.incomplet { background: #ffaa44; color: #1a2a3a; }
        
        /* CARTE ACTION (toujours visible) */
        .action-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }
        .action-icon { width: 70px; height: 70px; background: rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .action-icon i { font-size: 2rem; color: #2e7d32; }
        .action-card h3 { font-size: 1.1rem; margin-bottom: 8px; color: #1a3a1a; }
        .action-card p { font-size: 0.85rem; color: #2e7d32; margin-bottom: 20px; }
        .action-btn {
            background: #4ade80;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            color: #1a2a3a;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
        }
        .action-btn:hover { background: #22c55e; transform: translateY(-2px); }
        
        /* CARROUSEL CATÉGORIES (compte vérifié) */
        .categories-carousel {
            margin: 20px 16px;
            position: relative;
            display: none;
        }
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }
        .category-slide {
            flex: 0 0 100%;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 28px;
            padding: 20px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }
        .category-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a3a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-products {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scrollbar-width: thin;
            padding-bottom: 8px;
        }
        .category-products::-webkit-scrollbar { height: 4px; }
        .category-products::-webkit-scrollbar-track { background: #e8ecf0; border-radius: 4px; }
        .category-products::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
        .cat-product-card {
            flex: 0 0 140px;
            background: rgba(255,255,255,0.4);
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .cat-product-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.6); }
        .cat-product-img { width: 100%; height: 120px; border-radius: 16px; object-fit: cover; margin-bottom: 8px; background: rgba(255,255,255,0.5); }
        .cat-product-img-placeholder { width: 100%; height: 120px; border-radius: 16px; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #2e7d32; margin-bottom: 8px; }
        .cat-product-name { font-weight: 600; font-size: 0.7rem; color: #1a3a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .carousel-nav {
            position: absolute; top: 40%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); border: none; border-radius: 50%;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white; z-index: 10; transition: all 0.2s;
        }
        .carousel-nav:hover { background: #4ade80; }
        .carousel-nav.prev { left: 12px; }
        .carousel-nav.next { right: 12px; }
        .carousel-dots { display: flex; justify-content: center; gap: 8px; padding: 16px 0 4px; }
        .carousel-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(46,125,50,0.3); cursor: pointer; }
        .carousel-dot.active { background: #4ade80; width: 24px; border-radius: 4px; }
        
        /* SECTION OFFRES DU MOMENT (produits boostés - carte premium) */
        .promo-section { margin: 24px 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-header h2 { font-size: 1rem; font-weight: 700; color: #1a2a3a; display: flex; align-items: center; gap: 8px; }
        .section-header h2 i { color: #ff4d4d; }
        .promo-scroll { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; padding-bottom: 8px; }
        .promo-scroll::-webkit-scrollbar { height: 4px; }
        .promo-scroll::-webkit-scrollbar-track { background: #e8ecf0; border-radius: 4px; }
        .promo-scroll::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
        .promo-track { display: flex; gap: 16px; }
        .promo-product-card {
            flex: 0 0 320px;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .promo-product-card:hover { transform: translateY(-4px); box-shadow: 4px 4px 8px #9bb8a8, -4px -4px 8px #f0fff4; }
        .promo-img-wrap { width: 100px; height: 100px; flex-shrink: 0; background: rgba(255,255,255,0.4); border-radius: 18px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .promo-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .promo-img-wrap .image-placeholder { font-size: 2rem; color: #2e7d32; }
        .promo-badge { position: absolute; top: 6px; left: 6px; background: #ff4d4d; color: white; font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 20px; }
        .promo-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .promo-name { font-weight: 700; font-size: 0.85rem; color: #1a3a1a; }
        .promo-shop { font-size: 0.65rem; color: #2e7d32; display: flex; align-items: center; gap: 4px; }
        .promo-price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .promo-original-price { font-size: 0.7rem; color: #6a8a6a; text-decoration: line-through; }
        .promo-current-price { font-size: 0.9rem; font-weight: 800; color: #ff4d4d; }
        .promo-actions { display: flex; gap: 8px; margin-top: 4px; }
        .promo-btn {
            flex: 1; padding: 8px; border-radius: 40px; font-size: 0.7rem; font-weight: 600;
            cursor: pointer; border: none; background: #ffffff; color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
        }
        .promo-btn.cart { background: #4ade80; color: #1a2a3a; }
        .promo-btn:hover { transform: translateY(-2px); }
        .empty-promo { text-align: center; padding: 40px; color: #8a9aaa; background: #e0e5ec; border-radius: 20px; }
        
        /* CARTE MESSAGE AUTHENTIFICATION */
        .auth-message-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
            display: none;
        }
        .auth-message-card i { font-size: 2.5rem; color: #4ade80; margin-bottom: 12px; display: block; }
        .auth-message-card h3 { font-size: 1rem; margin-bottom: 8px; color: #1a3a1a; }
        .auth-message-card p { font-size: 0.8rem; color: #2e7d32; margin-bottom: 16px; }
        .auth-message-btn {
            background: #4ade80;
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            color: #1a2a3a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }
        
        @media (max-width: 600px) {
            .main-header { margin: 12px 12px 0 12px; padding: 0 16px; height: 60px; }
            .logo-img { width: 32px; height: 32px; }
            .header-center { font-size: 1rem; }
            .status-badge { padding: 5px 10px; font-size: 0.6rem; }
            .status-badge span { display: none; }
            .promo-product-card { flex: 0 0 280px; padding: 12px; gap: 12px; }
            .promo-img-wrap { width: 80px; height: 80px; }
            .cat-product-card { flex: 0 0 120px; }
            .cat-product-img, .cat-product-img-placeholder { height: 100px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="logo">
            <img src="assets/logo.png" alt="Megane Market" class="logo-img" onerror="this.src='https://placehold.co/40x40?text=MM'">
        </a>
        <div class="header-center">Megane Market</div>
        <div id="statusBtn" class="status-badge incomplet">

            <span>Chargement...</span>
        </div>
    </header>

    <!-- CARTE ACTION (toujours visible) -->
    <div class="action-card" id="actionCard">
        <div class="action-icon"><i class="fas fa-store"></i></div>
        <h3 id="actionTitle">Visiter le marché</h3>
        <p id="actionText">Découvrez tous nos produits et vendeurs.</p>
        <a href="market-new.html" class="action-btn" id="actionBtn">
            <i class="fas fa-store"></i> Visiter le marché
        </a>
    </div>

    <!-- CARTE MESSAGE AUTHENTIFICATION -->
    <div id="authMessageCard" class="auth-message-card">
        <i class="fas" id="authMessageIcon"></i>
        <h3 id="authMessageTitle"></h3>
        <p id="authMessageText"></p>
        <a href="#" id="authMessageBtn" class="auth-message-btn"></a>
    </div>

    <!-- CARROUSEL CATÉGORIES (compte vérifié) -->
    <div id="categoriesCarousel" class="categories-carousel">
        <div class="carousel-container">
            <div class="carousel-track" id="categoriesTrack"></div>
            <button class="carousel-nav prev" id="carouselPrev"><i class="fas fa-chevron-left"></i></button>
            <button class="carousel-nav next" id="carouselNext"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <!-- SECTION OFFRES DU MOMENT (produits boostés) -->
    <div class="promo-section">
        <div class="section-header">
            <h2><i class="fas fa-fire"></i> Offres du moment</h2>
        </div>
        <div class="promo-scroll">
            <div class="promo-track" id="promoTrack">
                <div class="empty-promo">Chargement des offres...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const statusBtn = document.getElementById('statusBtn');
            const authMessageCard = document.getElementById('authMessageCard');
            const authMessageIcon = document.getElementById('authMessageIcon');
            const authMessageTitle = document.getElementById('authMessageTitle');
            const authMessageText = document.getElementById('authMessageText');
            const authMessageBtn = document.getElementById('authMessageBtn');
            const categoriesCarousel = document.getElementById('categoriesCarousel');
            const categoriesTrack = document.getElementById('categoriesTrack');
            const carouselPrev = document.getElementById('carouselPrev');
            const carouselNext = document.getElementById('carouselNext');
            const carouselDots = document.getElementById('carouselDots');
            const promoTrack = document.getElementById('promoTrack');

            let allProducts = [];
            let categoriesList = [];
            let carouselInterval = null;
            let currentSlide = 0;
            let productBoosts = {};
            let currentUserId = null;
            let currentUserVerified = false;

            function formatPrice(price) { return new Intl.NumberFormat('fr-FR').format(price); }
            function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
            function updateStatusBadge(isComplete) {
                if (isComplete) { statusBtn.className = 'status-badge complet'; statusBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span>Compte complet</span>'; }
                else { statusBtn.className = 'status-badge incomplet'; statusBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> <span>Compte incomplet</span>'; }
            }

            async function loadProductBoosts() {
                const { data } = await supabase.from('product_boosts').select('product_id, discount_percent').eq('is_active', true);
                productBoosts = {};
                for (const boost of data || []) { if (boost.discount_percent > 0) productBoosts[boost.product_id] = boost.discount_percent; }
            }

            async function loadPromoProducts() {
                const { data: boosts } = await supabase.from('product_boosts').select('*, products!inner(*)').eq('is_active', true).eq('products.active', true);
                if (!boosts || boosts.length === 0) { promoTrack.innerHTML = '<div class="empty-promo">Aucune offre promotionnelle pour le moment</div>'; return; }
                const productsWithBoost = [];
                for (const boost of boosts) {
                    const product = boost.products;
                    let marketName = 'Vendeur';
                    if (product.user_id) {
                        const { data: market } = await supabase.from('markets').select('market_name, owner_name').eq('id', product.user_id).single();
                        marketName = market?.market_name || market?.owner_name || 'Vendeur';
                    }
                    productsWithBoost.push({ ...product, discount: boost.discount_percent, market_name: marketName });
                }
                promoTrack.innerHTML = productsWithBoost.map(product => {
                    const discount = product.discount;
                    const originalPrice = product.price;
                    const discountedPrice = Math.round(originalPrice * (1 - discount / 100));
                    const imageUrl = product.images && product.images[0] ? product.images[0] : null;
                    return `<div class="promo-product-card" data-id="${product.id}">
                        <div class="promo-img-wrap">${imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name)}" onerror="this.src=''">` : `<div class="image-placeholder"><i class="fas fa-image"></i></div>`}<div class="promo-badge">-${discount}%</div></div>
                        <div class="promo-info"><div class="promo-name">${escapeHtml(product.name)}</div><div class="promo-shop"><i class="fas fa-store"></i> ${escapeHtml(product.market_name)}</div><div class="promo-price-row"><span class="promo-original-price">${formatPrice(originalPrice)} FCFA</span><span class="promo-current-price">${formatPrice(discountedPrice)} FCFA</span></div><div class="promo-actions"><button class="promo-btn view">Voir</button><button class="promo-btn cart">Ajouter</button></div></div>
                    </div>`;
                }).join('');
                document.querySelectorAll('.promo-product-card').forEach(card => {
                    const productId = card.getAttribute('data-id');
                    card.querySelector('.view')?.addEventListener('click', (e) => { e.stopPropagation(); if (productId) window.location.href = `viewproduct.html?id=${productId}`; });
                    card.querySelector('.cart')?.addEventListener('click', (e) => { e.stopPropagation(); showToast('Connectez-vous pour ajouter au panier', 'error'); });
                    card.addEventListener('click', (e) => { if (e.target.classList.contains('promo-btn')) return; if (productId) window.location.href = `viewproduct.html?id=${productId}`; });
                });
            }

            async function loadAllProducts() {
                const { data: products } = await supabase.from('products').select('*').eq('active', true);
                allProducts = products || [];
                const categoriesMap = new Map();
                for (const product of allProducts) {
                    if (product.category && product.category.trim()) { categoriesMap.set(product.category.trim(), (categoriesMap.get(product.category.trim()) || 0) + 1); }
                }
                categoriesList = Array.from(categoriesMap.keys()).sort();
            }

            function getProductsByCategory(category, limit = 3) {
                return allProducts.filter(p => p.category === category).slice(0, limit);
            }

            function initCarousel() {
                if (!categoriesTrack || categoriesList.length === 0) return;
                const totalSlides = categoriesList.length;
                carouselDots.innerHTML = categoriesList.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`).join('');
                function goToSlide(index) {
                    currentSlide = (index + totalSlides) % totalSlides;
                    categoriesTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
                    document.querySelectorAll('.carousel-dot').forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
                }
                function nextSlide() { goToSlide(currentSlide + 1); resetTimer(); }
                function prevSlide() { goToSlide(currentSlide - 1); resetTimer(); }
                function resetTimer() { if (carouselInterval) clearInterval(carouselInterval); if (totalSlides > 1) carouselInterval = setInterval(nextSlide, 6000); }
                carouselPrev.addEventListener('click', prevSlide);
                carouselNext.addEventListener('click', nextSlide);
                document.querySelectorAll('.carousel-dot').forEach(dot => dot.addEventListener('click', () => { goToSlide(parseInt(dot.dataset.index)); resetTimer(); }));
                resetTimer();
            }

            function renderCategoriesCarousel() {
                if (categoriesList.length === 0) return;
                categoriesTrack.innerHTML = categoriesList.map(category => {
                    const products = getProductsByCategory(category, 3);
                    return `<div class="category-slide"><div class="category-title"><i class="fas fa-tag"></i> ${escapeHtml(category)}</div><div class="category-products">${products.map(p => {
                        const imageUrl = p.images && p.images[0] ? p.images[0] : null;
                        return `<div class="cat-product-card" data-id="${p.id}">${imageUrl ? `<img src="${escapeHtml(imageUrl)}" class="cat-product-img" onerror="this.src=''">` : `<div class="cat-product-img-placeholder"><i class="fas fa-image"></i></div>`}<div class="cat-product-name">${escapeHtml(p.name)}</div></div>`;
                    }).join('')}</div></div>`;
                }).join('');
                document.querySelectorAll('.cat-product-card').forEach(card => {
                    card.addEventListener('click', () => { const id = card.getAttribute('data-id'); if (id) window.location.href = `viewproduct.html?id=${id}`; });
                });
                initCarousel();
            }

            function showAuthMessage(icon, title, message, btnText, btnLink) {
                authMessageIcon.className = `fas ${icon}`;
                authMessageTitle.textContent = title;
                authMessageText.textContent = message;
                authMessageBtn.textContent = btnText;
                authMessageBtn.href = btnLink;
                authMessageCard.style.display = 'block';
                categoriesCarousel.style.display = 'none';
            }

            function hideAuthMessage() {
                authMessageCard.style.display = 'none';
                categoriesCarousel.style.display = 'block';
            }

            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    currentUserId = null;
                    currentUserVerified = false;
                    updateStatusBadge(false);
                    showAuthMessage('fa-sign-in-alt', 'Connectez-vous', 'Connectez-vous pour profiter de toutes les fonctionnalités de Megane Market.', 'Se connecter', 'login.html');
                    return false;
                }
                currentUserId = session.user.id;
                const { data: verifData } = await supabase.from('email_verifications').select('is_verified').eq('user_id', currentUserId).single();
                currentUserVerified = verifData?.is_verified === true;
                if (!currentUserVerified) {
                    updateStatusBadge(false);
                    showAuthMessage('fa-envelope', 'Email non vérifié', 'Merci de vérifier votre email pour confirmer que c\'est le vôtre et recevoir des notifications.', 'Vérifier mon email', 'email-verify.html');
                    return false;
                }
                const { data: buyer } = await supabase.from('buyers').select('full_name, phone, city').eq('id', currentUserId).single();
                const isComplete = !!(buyer?.full_name && buyer.full_name.trim() !== '' && buyer?.phone && buyer.phone.trim() !== '' && buyer?.city && buyer.city.trim() !== '');
                updateStatusBadge(isComplete);
                hideAuthMessage();
                return true;
            }

            function showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.textContent = message;
                toast.style.position = 'fixed'; toast.style.bottom = '80px'; toast.style.left = '50%'; toast.style.transform = 'translateX(-50%)';
                toast.style.background = type === 'success' ? '#4ade80' : '#1a2a3a'; toast.style.color = 'white'; toast.style.padding = '10px 20px';
                toast.style.borderRadius = '40px'; toast.style.fontSize = '0.8rem'; toast.style.zIndex = '1100'; toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease'; document.body.appendChild(toast);
                setTimeout(() => toast.style.opacity = '1', 10);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            }

            async function init() {
                await loadProductBoosts();
                await loadAllProducts();
                await loadPromoProducts();
                const isVerified = await checkSession();
                if (isVerified && categoriesList.length > 0) { renderCategoriesCarousel(); }
                else if (isVerified && categoriesList.length === 0) { categoriesCarousel.style.display = 'none'; }
            }
            init();
        })();
    </script>
</body>
</html>
