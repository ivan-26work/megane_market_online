<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Produits - Megane Market</title>
    <meta name="theme-color" content="#4ade80">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* HEADER NÉOMORPHIQUE VERT */
        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 60px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .back-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .search-container {
            flex: 1;
            position: relative;
            max-width: 300px;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
            font-size: 0.8rem;
            pointer-events: none;
        }

        .search-container input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: #e0e5ec;
            border: none;
            border-radius: 30px;
            color: #1a2a3a;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            box-shadow: inset 5px 5px 10px #9bb8a8, inset -5px -5px 10px #f0fff4;
        }

        .search-container input::placeholder {
            color: #5a7a5a;
        }

        .icon-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            position: relative;
        }

        .icon-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .icon-btn.active {
            background: #4ade80;
            color: white;
        }

        /* BARRE DE FILTRE CATÉGORIES */
        .filters-bar {
            margin: 16px 16px 0 16px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            padding-bottom: 8px;
        }

        .filters-bar::-webkit-scrollbar {
            height: 4px;
        }

        .filters-bar::-webkit-scrollbar-track {
            background: #e8ecf0;
            border-radius: 4px;
        }

        .filters-bar::-webkit-scrollbar-thumb {
            background: #4ade80;
            border-radius: 4px;
        }

        .filters-scroll {
            display: flex;
            gap: 8px;
        }

        .filter-chip {
            background: #e0e5ec;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2e7d32;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
        }

        .filter-chip:hover {
            background: #4ade80;
            color: white;
            transform: translateY(-2px);
        }

        .filter-chip.active {
            background: #4ade80;
            color: white;
        }

        /* GRILLE PRODUITS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px 16px;
        }

        /* ============ CARTE PROMOTION (STYLE CARTE 1 adapté néomorphique) ============ */
        .product-card.promo {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
            cursor: pointer;
        }

        .product-card.promo:hover {
            transform: translateY(-4px);
            box-shadow: 4px 4px 8px #9bb8a8, -4px -4px 8px #f0fff4;
        }

        .promo .img-wrap {
            position: relative;
            height: 140px;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .promo .badge-promo {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4d4d;
            color: white;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 2;
        }

        .promo .body {
            padding: 12px;
        }

        .promo .name {
            color: #1a3a1a;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .promo .shop {
            color: #2e7d32;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .promo .views {
            color: #5a7a5a;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }

        .promo .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .promo .price {
            color: #ff4d4d;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .promo .old-price {
            color: #6a8a6a;
            font-size: 0.7rem;
            text-decoration: line-through;
        }

        .promo .btn-row {
            display: flex;
            gap: 8px;
        }

        .promo .btn {
            flex: 1;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .promo .btn.view {
            background: #ffffff;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }

        .promo .btn.view:hover {
            background: #4ade80;
            color: white;
            transform: translateY(-2px);
        }

        .promo .btn.cart {
            background: #4ade80;
            color: #1a2a3a;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }

        .promo .btn.cart:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        /* ============ CARTE ORDINAIRE (STYLE CARTE 18 adapté néomorphique) ============ */
        .product-card.normal {
            background: #e0e5ec;
            border-radius: 24px;
            padding: 16px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-card.normal:hover {
            transform: translateY(-4px);
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
        }

        .normal .img-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 12px;
            box-shadow: inset 3px 3px 6px #a3b1c6, inset -3px -3px 6px #ffffff, 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            overflow: hidden;
            position: relative;
        }

        .normal .img-circle .product-carousel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .normal .img-circle .carousel-images-container {
            width: 100%;
            height: 100%;
        }

        .normal .img-circle .carousel-img {
            border-radius: 50%;
        }

        .normal .img-circle .carousel-nav-prev,
        .normal .img-circle .carousel-nav-next {
            width: 22px;
            height: 22px;
            font-size: 0.55rem;
        }

        .normal .name {
            color: #1a2a3a;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .normal .shop {
            color: #4ade80;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .normal .views {
            color: #8a9aaa;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }

        .normal .price {
            color: #2e7d32;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .normal .btn-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .normal .btn {
            flex: 1;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .normal .btn.view {
            background: #ffffff;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
        }

        .normal .btn.view:hover {
            background: #4ade80;
            color: white;
            transform: translateY(-2px);
        }

        .normal .btn.cart {
            background: #4ade80;
            color: #1a2a3a;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
        }

        .normal .btn.cart:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        /* CARROUSEL D'IMAGES */
        .product-carousel {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .carousel-images-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .carousel-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .carousel-img.active {
            opacity: 1;
            position: relative;
        }

        .carousel-nav-prev,
        .carousel-nav-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 0.7rem;
            transition: all 0.2s;
            z-index: 10;
            opacity: 0;
        }

        .promo .img-wrap:hover .carousel-nav-prev,
        .promo .img-wrap:hover .carousel-nav-next,
        .normal .img-circle:hover .carousel-nav-prev,
        .normal .img-circle:hover .carousel-nav-next {
            opacity: 0.8;
        }

        .carousel-nav-prev:hover,
        .carousel-nav-next:hover {
            background: #4ade80;
            opacity: 1;
        }

        .carousel-nav-prev { left: 5px; }
        .carousel-nav-next { right: 5px; }

        .carousel-dots-container {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 5px;
            z-index: 10;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
        }

        .carousel-dot.active {
            background: #4ade80;
            width: 16px;
            border-radius: 3px;
        }

        /* ÉTATS VIDES ET CHARGEMENT */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aaa;
            grid-column: 1 / -1;
            background: #e0e5ec;
            border-radius: 24px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
        }

        .loader {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e8ecf0;
            border-top-color: #4ade80;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2a3a;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .products-grid {
                gap: 12px;
                padding: 16px;
            }
            .promo .img-wrap {
                height: 120px;
            }
            .normal .img-circle {
                width: 75px;
                height: 75px;
                font-size: 2rem;
            }
            .promo .name, .normal .name {
                font-size: 0.75rem;
            }
            .promo .btn, .normal .btn {
                padding: 6px;
                font-size: 0.6rem;
            }
            .promo .btn i, .normal .btn i {
                display: none;
            }
            .main-header {
                margin: 12px 12px 0 12px;
                padding: 0 15px;
                height: 55px;
            }
            .back-btn, .icon-btn {
                width: 36px;
                height: 36px;
            }
            .search-container {
                max-width: 160px;
            }
            .filter-chip {
                padding: 6px 14px;
                font-size: 0.7rem;
            }
        }

        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="market-new.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="search-container" id="searchContainer">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Rechercher..." readonly>
        </div>
        <button id="favoritesBtn" class="icon-btn" title="Mes favoris">
            <i class="fas fa-heart"></i>
        </button>
    </header>

    <div class="filters-bar" id="filtersBar">
        <div class="filters-scroll" id="filtersScroll"></div>
    </div>

    <main>
        <div id="productsGrid" class="products-grid">
            <div class="loader">
                <div class="spinner"></div>
                <p>Chargement...</p>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const productsGrid = document.getElementById('productsGrid');
            const toastEl = document.getElementById('toast');
            const searchContainer = document.getElementById('searchContainer');
            const favoritesBtn = document.getElementById('favoritesBtn');

            let currentUserId = null;
            let allProducts = [];
            let categories = [];
            let currentCategory = null;
            let showFavorites = false;
            let userFavorites = new Set();
            let productBoosts = {};
            let productViews = {};
            let carouselIntervals = {};

            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = `toast ${type} show`;
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('fr-FR').format(price);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return false;
                }
                currentUserId = session.user.id;
                const { data: verifData } = await supabase
                    .from('email_verifications')
                    .select('is_verified')
                    .eq('user_id', currentUserId)
                    .single();
                if (!verifData || verifData.is_verified !== true) {
                    window.location.href = 'email-verify.html';
                    return false;
                }
                return true;
            }

            async function loadProductBoosts() {
                const { data } = await supabase
                    .from('product_boosts')
                    .select('product_id, discount_percent')
                    .eq('is_active', true);
                productBoosts = {};
                for (const boost of data || []) {
                    if (boost.discount_percent > 0) {
                        productBoosts[boost.product_id] = boost.discount_percent;
                    }
                }
            }

            async function loadProductViews() {
                const { data } = await supabase
                    .from('product_stats')
                    .select('product_id, view_count');
                productViews = {};
                for (const stat of data || []) {
                    productViews[stat.product_id] = (productViews[stat.product_id] || 0) + (stat.view_count || 0);
                }
            }

            async function loadUserFavorites() {
                if (!currentUserId) return;
                const { data } = await supabase
                    .from('user_favorites')
                    .select('product_id')
                    .eq('user_id', currentUserId);
                userFavorites.clear();
                for (const fav of data || []) {
                    userFavorites.add(fav.product_id);
                }
                updateFavoritesButton();
            }

            async function toggleFavorite(productId, event) {
                event.stopPropagation();
                if (!currentUserId) {
                    showToast('Connectez-vous pour ajouter aux favoris', 'error');
                    window.location.href = 'login.html';
                    return;
                }
                const isFavorite = userFavorites.has(productId);
                if (isFavorite) {
                    await supabase.from('user_favorites').delete().eq('user_id', currentUserId).eq('product_id', productId);
                    userFavorites.delete(productId);
                    showToast('Retiré des favoris', 'success');
                } else {
                    await supabase.from('user_favorites').insert({ user_id: currentUserId, product_id: productId });
                    userFavorites.add(productId);
                    showToast('Ajouté aux favoris', 'success');
                }
                updateFavoritesButton();
                if (showFavorites) {
                    loadProducts();
                } else {
                    updateFavoriteIcons();
                }
            }

            function updateFavoritesButton() {
                if (showFavorites) {
                    favoritesBtn.classList.add('active');
                } else {
                    favoritesBtn.classList.remove('active');
                }
            }

            function updateFavoriteIcons() {
                document.querySelectorAll('.favorite-icon').forEach(icon => {
                    const productId = icon.getAttribute('data-id');
                    if (userFavorites.has(productId)) {
                        icon.innerHTML = '<i class="fas fa-heart"></i>';
                        icon.style.color = '#ff4d4d';
                    } else {
                        icon.innerHTML = '<i class="far fa-heart"></i>';
                        icon.style.color = '#2e7d32';
                    }
                });
            }

            async function loadCategories() {
                const { data: products } = await supabase
                    .from('products')
                    .select('category')
                    .eq('active', true);
                const catSet = new Set();
                for (const product of products || []) {
                    if (product.category && product.category.trim()) {
                        catSet.add(product.category.trim());
                    }
                }
                categories = Array.from(catSet).sort();
                renderFilters();
            }

            function renderFilters() {
                const container = document.getElementById('filtersScroll');
                if (!container) return;
                let html = '';
                for (const cat of categories) {
                    html += `<button class="filter-chip" data-category="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
                }
                container.innerHTML = html;
                document.querySelectorAll('.filter-chip').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentCategory = btn.getAttribute('data-category');
                        showFavorites = false;
                        updateFavoritesButton();
                        loadProducts();
                    });
                });
                if (currentCategory) {
                    const activeBtn = document.querySelector(`.filter-chip[data-category="${currentCategory}"]`);
                    if (activeBtn) activeBtn.classList.add('active');
                } else if (categories.length > 0) {
                    currentCategory = categories[0];
                    const firstBtn = document.querySelector(`.filter-chip[data-category="${categories[0]}"]`);
                    if (firstBtn) firstBtn.classList.add('active');
                    loadProducts();
                }
            }

            async function loadProducts() {
                productsGrid.innerHTML = '<div class="loader"><div class="spinner"></div><p>Chargement...</p></div>';
                let query = supabase.from('products').select('*').eq('active', true);
                if (currentCategory) {
                    query = query.eq('category', currentCategory);
                }
                const { data: products } = await query.order('created_at', { ascending: false });
                let filtered = products || [];
                if (showFavorites) {
                    filtered = filtered.filter(p => userFavorites.has(p.id));
                }
                allProducts = filtered;
                if (allProducts.length === 0) {
                    productsGrid.innerHTML = '<div class="empty-state"><i class="fas fa-heart-broken"></i><p>Aucun produit trouvé dans cette catégorie</p></div>';
                    return;
                }
                renderProducts();
            }

            function initProductCarousel(container, images, productId) {
                if (!container || !images || images.length <= 1) return;
                const imgElement = container.querySelector('.carousel-img');
                const prevBtn = container.querySelector('.carousel-nav-prev');
                const nextBtn = container.querySelector('.carousel-nav-next');
                const dotsContainer = container.querySelector('.carousel-dots-container');
                if (!imgElement) return;
                let currentIndex = 0;
                imgElement.src = images[0];
                imgElement.classList.add('active');
                if (dotsContainer) {
                    dotsContainer.innerHTML = '';
                    images.forEach((_, i) => {
                        const dot = document.createElement('div');
                        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
                        dot.addEventListener('click', (e) => { e.stopPropagation(); goToSlide(i); });
                        dotsContainer.appendChild(dot);
                    });
                }
                function goToSlide(index) {
                    currentIndex = (index + images.length) % images.length;
                    imgElement.src = images[currentIndex];
                    if (dotsContainer) {
                        const dots = dotsContainer.querySelectorAll('.carousel-dot');
                        dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
                    }
                    resetInterval();
                }
                function nextSlide() { goToSlide(currentIndex + 1); }
                function prevSlide() { goToSlide(currentIndex - 1); }
                let interval = setInterval(nextSlide, 4000);
                function resetInterval() { clearInterval(interval); interval = setInterval(nextSlide, 4000); }
                if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
                if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
                if (carouselIntervals[productId]) clearInterval(carouselIntervals[productId]);
                carouselIntervals[productId] = interval;
                container.addEventListener('mouseenter', () => clearInterval(interval));
                container.addEventListener('mouseleave', () => { interval = setInterval(nextSlide, 4000); carouselIntervals[productId] = interval; });
            }

            function createProductCarouselHtml(images, productId) {
                if (!images || images.length === 0) {
                    return `<div class="product-carousel" data-product-id="${productId}"><div class="carousel-images-container"><img class="carousel-img active" src="" alt=""></div></div>`;
                }
                if (images.length === 1) {
                    return `<div class="product-carousel" data-product-id="${productId}"><div class="carousel-images-container"><img class="carousel-img active" src="${escapeHtml(images[0])}" alt=""></div></div>`;
                }
                return `
                    <div class="product-carousel" data-product-id="${productId}">
                        <div class="carousel-images-container">
                            <img class="carousel-img active" src="${escapeHtml(images[0])}" alt="">
                        </div>
                        <button class="carousel-nav-prev"><i class="fas fa-chevron-left"></i></button>
                        <button class="carousel-nav-next"><i class="fas fa-chevron-right"></i></button>
                        <div class="carousel-dots-container"></div>
                    </div>
                `;
            }

            async function getMarketName(userId) {
                if (!userId) return 'Vendeur';
                const { data } = await supabase
                    .from('markets')
                    .select('market_name, owner_name')
                    .eq('id', userId)
                    .single();
                return data?.market_name || data?.owner_name || 'Vendeur';
            }

            async function renderProducts() {
                // Récupérer les noms des marchés pour chaque produit
                const marketNames = {};
                for (const product of allProducts) {
                    if (product.user_id && !marketNames[product.user_id]) {
                        marketNames[product.user_id] = await getMarketName(product.user_id);
                    }
                }
                
                const productsHtml = await Promise.all(allProducts.map(async product => {
                    const discount = productBoosts[product.id] || 0;
                    const originalPrice = product.price;
                    const discountedPrice = discount > 0 ? Math.round(originalPrice * (1 - discount / 100)) : originalPrice;
                    const images = product.images || [];
                    const carouselHtml = createProductCarouselHtml(images, product.id);
                    const isFavorite = userFavorites.has(product.id);
                    const views = productViews[product.id] || 0;
                    const marketName = marketNames[product.user_id] || 'Vendeur';
                    
                    if (discount > 0) {
                        // Carte promotionnelle (style Carte 1)
                        return `
                            <div class="product-card promo" data-product-id="${product.id}">
                                <div class="img-wrap">
                                    ${carouselHtml}
                                    <span class="badge-promo">-${discount}%</span>
                                </div>
                                <div class="body">
                                    <div class="name">${escapeHtml(product.name)}</div>
                                    <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                                    <div class="views"><i class="fas fa-eye"></i> ${views} vues</div>
                                    <div class="price-row">
                                        <span class="price">${formatPrice(discountedPrice)} FCFA</span>
                                        <span class="old-price">${formatPrice(originalPrice)} FCFA</span>
                                    </div>
                                    <div class="btn-row">
                                        <button class="btn view"><i class="fas fa-eye"></i> Voir</button>
                                        <button class="btn cart"><i class="fas fa-cart-plus"></i> Ajouter</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // Carte ordinaire (style Carte 18)
                        return `
                            <div class="product-card normal" data-product-id="${product.id}">
                                <div class="img-circle">
                                    ${carouselHtml}
                                </div>
                                <div class="name">${escapeHtml(product.name)}</div>
                                <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                                <div class="views"><i class="fas fa-eye"></i> ${views} vues</div>
                                <div class="price">${formatPrice(originalPrice)} FCFA</div>
                                <div class="btn-row">
                                    <button class="btn view"><i class="fas fa-eye"></i> Voir</button>
                                    <button class="btn cart"><i class="fas fa-cart-plus"></i> Ajouter</button>
                                </div>
                            </div>
                        `;
                    }
                }));
                
                productsGrid.innerHTML = productsHtml.join('');
                
                // Initialiser les carrousels
                for (const product of allProducts) {
                    const carousel = document.querySelector(`.product-card[data-product-id="${product.id}"] .product-carousel`);
                    if (carousel && product.images && product.images.length > 1) {
                        initProductCarousel(carousel, product.images, product.id);
                    }
                }
                
                // Boutons ajouter au panier
                document.querySelectorAll('.btn.cart').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const productCard = btn.closest('.product-card');
                        const productId = productCard.getAttribute('data-product-id');
                        if (productId && currentUserId) await addToCart(productId);
                        else if (!currentUserId) { showToast('Connectez-vous', 'error'); window.location.href = 'login.html'; }
                    });
                });
                
                // Clic sur carte
                document.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.btn')) return;
                        const productId = card.getAttribute('data-product-id');
                        if (productId) window.location.href = `viewproduct.html?id=${productId}`;
                    });
                });
                
                // Boutons favoris
                document.querySelectorAll('.favorite-icon').forEach(icon => {
                    icon.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const productId = icon.getAttribute('data-id');
                        if (productId) await toggleFavorite(productId, e);
                    });
                });
            }

            async function addToCart(productId) {
                try {
                    const { data: existing } = await supabase.from('cart').select('id, quantity').eq('user_id', currentUserId).eq('product_id', productId).maybeSingle();
                    if (existing) {
                        await supabase.from('cart').update({ quantity: existing.quantity + 1 }).eq('id', existing.id);
                        showToast('Quantité augmentée', 'success');
                    } else {
                        await supabase.from('cart').insert({ user_id: currentUserId, product_id: productId, quantity: 1 });
                        showToast('Produit ajouté au panier', 'success');
                    }
                } catch (err) { showToast('Erreur', 'error'); }
            }

            favoritesBtn.addEventListener('click', () => {
                showFavorites = !showFavorites;
                updateFavoritesButton();
                if (showFavorites) {
                    loadProducts();
                } else if (currentCategory) {
                    loadProducts();
                }
            });

            searchContainer.addEventListener('click', () => {
                window.location.href = 'search.html';
            });

            async function getUrlCategory() {
                const params = new URLSearchParams(window.location.search);
                const cat = params.get('category');
                if (cat && categories.includes(cat)) {
                    currentCategory = cat;
                } else {
                    window.location.href = 'market-new.html';
                    return false;
                }
                return true;
            }

            async function init() {
                const allowed = await checkSession();
                if (allowed) {
                    await loadProductBoosts();
                    await loadProductViews();
                    await loadUserFavorites();
                    await loadCategories();
                    const hasCategory = await getUrlCategory();
                    if (hasCategory !== false) {
                        await loadProducts();
                    }
                }
            }
            init();
        })();
    </script>
</body>
</html>
