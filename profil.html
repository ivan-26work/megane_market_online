<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Mon profil - Megane Market</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* HEADER NÉOMORPHIQUE VERT */
        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 60px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .back-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .header-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #2e7d32;
            text-align: center;
            flex: 1;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        /* CARTE PROFIL */
        .profile-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 20px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            cursor: pointer;
        }

        .profile-avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e7d32;
            font-size: 2rem;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            cursor: pointer;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1a3a1a;
            margin-bottom: 4px;
        }

        .profile-email {
            font-size: 0.8rem;
            color: #2e7d32;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* CARTE FORMULAIRE */
        .form-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .form-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2e7d32;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.4);
            border: none;
            border-radius: 16px;
            color: #1a3a1a;
            font-size: 0.85rem;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            box-shadow: inset 3px 3px 6px #9bb8a8, inset -3px -3px 6px #f0fff4;
        }

        .form-group input:focus {
            box-shadow: inset 2px 2px 4px #9bb8a8, inset -2px -2px 4px #f0fff4;
        }

        .form-group input:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: #5a7a5a;
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #4ade80;
            border: none;
            border-radius: 40px;
            color: #1a2a3a;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            margin-top: 8px;
        }

        .save-btn:hover {
            background: #22c55e;
            transform: translateY(-2px);
        }

        /* CARTE COMMANDES */
        .orders-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .orders-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-item {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .order-item:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateX(4px);
        }

        .order-img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            background: rgba(255,255,255,0.6);
        }

        .order-img-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e7d32;
            font-size: 1.2rem;
        }

        .order-info {
            flex: 1;
        }

        .order-product {
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3a1a;
            margin-bottom: 2px;
        }

        .order-date {
            font-size: 0.65rem;
            color: #5a7a5a;
        }

        .order-price {
            font-weight: 700;
            color: #ff4d4d;
            font-size: 0.8rem;
        }

        .empty-orders {
            text-align: center;
            padding: 30px;
            color: #5a7a5a;
        }

        .loader {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e8ecf0;
            border-top-color: #4ade80;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2a3a;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .main-header {
                margin: 12px 12px 0 12px;
                padding: 0 15px;
            }
            .back-btn, .icon-btn {
                width: 36px;
                height: 36px;
            }
            .header-title {
                font-size: 0.8rem;
            }
            .profile-card {
                padding: 16px;
                gap: 14px;
            }
            .profile-avatar,
            .profile-avatar-placeholder {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
            .profile-name {
                font-size: 0.9rem;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .order-item {
                padding: 10px;
                gap: 10px;
            }
            .order-img,
            .order-img-placeholder {
                width: 40px;
                height: 40px;
            }
            .order-product {
                font-size: 0.7rem;
            }
            .order-price {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <a href="market-new.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="header-title">Mon profil</div>
        <div class="header-actions">
            <button id="logoutBtn" class="icon-btn" title="Déconnexion">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main id="mainContent">
        <div class="loader">
            <div class="spinner"></div>
            <p>Chargement du profil...</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    <input type="file" id="avatarInput" accept="image/*" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const mainContent = document.getElementById('mainContent');
            const toastEl = document.getElementById('toast');
            const logoutBtn = document.getElementById('logoutBtn');
            const avatarInput = document.getElementById('avatarInput');

            let currentUserId = null;
            let currentUser = null;
            let currentProfile = null;
            let currentAvatarFile = null;

            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = `toast ${type} show`;
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('fr-FR').format(price);
            }

            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return false;
                }
                currentUserId = session.user.id;
                currentUser = session.user;
                return true;
            }

            async function loadProfile() {
                const { data: buyer, error } = await supabase
                    .from('buyers')
                    .select('*')
                    .eq('id', currentUserId)
                    .single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Erreur chargement profil:', error);
                }

                currentProfile = buyer || {
                    id: currentUserId,
                    email: currentUser.email,
                    full_name: '',
                    phone: '',
                    city: '',
                    address: ''
                };

                renderProfile();
            }

            async function loadOrders() {
                const { data: orders, error } = await supabase
                    .from('orders')
                    .select('*')
                    .eq('buyer_id', currentUserId)
                    .order('created_at', { ascending: false })
                    .limit(10);

                if (error) {
                    console.error('Erreur chargement commandes:', error);
                    return [];
                }
                return orders || [];
            }

            async function uploadAvatar() {
                if (!currentAvatarFile) return null;
                
                const ext = currentAvatarFile.name.split('.').pop();
                const fileName = `${currentUserId}/avatar_${Date.now()}.${ext}`;
                
                const { error } = await supabase.storage
                    .from('buyers-avatars')
                    .upload(fileName, currentAvatarFile, { upsert: true });
                
                if (error) {
                    console.error('Erreur upload:', error);
                    return null;
                }
                
                const { data } = supabase.storage
                    .from('buyers-avatars')
                    .getPublicUrl(fileName);
                
                return data.publicUrl;
            }

            async function saveProfile() {
                const fullName = document.getElementById('fullName')?.value.trim() || '';
                const phone = document.getElementById('phone')?.value.trim() || '';
                const city = document.getElementById('city')?.value.trim() || '';
                const address = document.getElementById('address')?.value.trim() || '';

                const saveBtn = document.getElementById('saveBtn');
                if (saveBtn) {
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Enregistrement...';
                }

                try {
                    let avatarUrl = currentProfile.avatar_url;
                    
                    if (currentAvatarFile) {
                        const uploadedUrl = await uploadAvatar();
                        if (uploadedUrl) avatarUrl = uploadedUrl;
                        currentAvatarFile = null;
                    }

                    const { error } = await supabase
                        .from('buyers')
                        .upsert({
                            id: currentUserId,
                            email: currentUser.email,
                            full_name: fullName,
                            phone: phone,
                            city: city,
                            address: address,
                            avatar_url: avatarUrl,
                            updated_at: new Date().toISOString()
                        });

                    if (error) throw error;

                    currentProfile = {
                        ...currentProfile,
                        full_name: fullName,
                        phone: phone,
                        city: city,
                        address: address,
                        avatar_url: avatarUrl
                    };

                    showToast('Profil enregistré !', 'success');
                    renderProfile();

                } catch (err) {
                    console.error(err);
                    showToast('Erreur: ' + err.message, 'error');
                } finally {
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
                    }
                }
            }

            async function logout() {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            }

            function renderProfile() {
                const avatarUrl = currentProfile?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentProfile?.full_name || currentUser?.email || 'User')}&background=4ade80&color=ffffff&size=100`;
                const fullName = currentProfile?.full_name || '';
                const phone = currentProfile?.phone || '';
                const city = currentProfile?.city || '';
                const address = currentProfile?.address || '';

                mainContent.innerHTML = `
                    <div class="profile-card">
                        <div id="avatarWrap" style="cursor: pointer;">
                            ${avatarUrl && avatarUrl !== '' 
                                ? `<img src="${escapeHtml(avatarUrl)}" class="profile-avatar" alt="Avatar" id="profileAvatar">`
                                : `<div class="profile-avatar-placeholder" id="profileAvatar"><i class="fas fa-user"></i></div>`
                            }
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">${escapeHtml(fullName || 'Nouveau client')}</div>
                            <div class="profile-email"><i class="fas fa-envelope"></i> ${escapeHtml(currentUser.email)}</div>
                        </div>
                    </div>

                    <div class="form-card">
                        <div class="form-title">
                            <i class="fas fa-user-edit"></i> Informations personnelles
                        </div>
                        <div class="form-group">
                            <label>Nom complet</label>
                            <input type="text" id="fullName" value="${escapeHtml(fullName)}" placeholder="Votre nom">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" value="${escapeHtml(currentUser.email)}" disabled>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Téléphone</label>
                                <input type="tel" id="phone" value="${escapeHtml(phone)}" placeholder="Ex: 05 03 58 83 36">
                            </div>
                            <div class="form-group">
                                <label>Ville / Quartier</label>
                                <input type="text" id="city" value="${escapeHtml(city)}" placeholder="Ex: Abidjan, Cocody">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Adresse</label>
                            <input type="text" id="address" value="${escapeHtml(address)}" placeholder="Ex: Rue des Jardins, près du marché">
                        </div>
                        <button id="saveBtn" class="save-btn"><i class="fas fa-save"></i> Enregistrer</button>
                    </div>

                    <div class="orders-card" id="ordersCard">
                        <div class="orders-title">
                            <i class="fas fa-shopping-cart"></i> Historique des commandes
                        </div>
                        <div class="orders-list" id="ordersList">
                            <div class="empty-orders">Chargement des commandes...</div>
                        </div>
                    </div>
                `;

                document.getElementById('avatarWrap').addEventListener('click', () => avatarInput.click());
                document.getElementById('saveBtn')?.addEventListener('click', saveProfile);
                
                loadOrders().then(orders => {
                    const ordersList = document.getElementById('ordersList');
                    if (!ordersList) return;
                    
                    if (orders.length === 0) {
                        ordersList.innerHTML = '<div class="empty-orders">Aucune commande pour le moment</div>';
                        return;
                    }
                    
                    ordersList.innerHTML = orders.map(order => `
                        <div class="order-item" data-id="${order.id}" data-product-id="${order.product_id}">
                            ${order.product_image 
                                ? `<img src="${escapeHtml(order.product_image)}" class="order-img" onerror="this.src=''">`
                                : `<div class="order-img-placeholder"><i class="fas fa-image"></i></div>`
                            }
                            <div class="order-info">
                                <div class="order-product">${escapeHtml(order.product_name)}</div>
                                <div class="order-date">${new Date(order.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                            </div>
                            <div class="order-price">${formatPrice(order.product_price)} FCFA</div>
                        </div>
                    `).join('');
                    
                    document.querySelectorAll('.order-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const productId = item.getAttribute('data-product-id');
                            if (productId) window.location.href = `viewproduct.html?id=${productId}`;
                        });
                    });
                });
            }

            avatarInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    currentAvatarFile = file;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const avatarImg = document.getElementById('profileAvatar');
                        if (avatarImg) {
                            if (avatarImg.tagName === 'IMG') {
                                avatarImg.src = ev.target.result;
                            } else {
                                const img = document.createElement('img');
                                img.src = ev.target.result;
                                img.className = 'profile-avatar';
                                img.id = 'profileAvatar';
                                avatarImg.parentNode.replaceChild(img, avatarImg);
                            }
                        }
                    };
                    reader.readAsDataURL(file);
                    showToast('Photo sélectionnée. Cliquez sur Enregistrer.', 'info');
                }
            });

            logoutBtn.addEventListener('click', logout);

            async function init() {
                const allowed = await checkSession();
                if (allowed) {
                    await loadProfile();
                }
            }
            init();
        })();
    </script>
</body>
</html>
