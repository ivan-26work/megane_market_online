<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Recherche - Megane Market</title>
    <meta name="theme-color" content="#4ade80">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* HEADER NÉOMORPHIQUE VERT */
        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 60px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .back-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #2e7d32;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-container input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: #e0e5ec;
            border: none;
            border-radius: 40px;
            color: #1a2a3a;
            font-size: 0.9rem;
            outline: none;
            box-shadow: inset 5px 5px 10px #9bb8a8, inset -5px -5px 10px #f0fff4;
            font-family: 'DM Sans', sans-serif;
        }

        .search-container input::placeholder {
            color: #5a7a5a;
        }

        .search-container input:focus {
            box-shadow: inset 3px 3px 6px #9bb8a8, inset -3px -3px 6px #f0fff4;
        }

        .search-btn {
            background: #4ade80;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            color: #1a2a3a;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
        }

        .search-btn:hover {
            background: #22c55e;
            transform: scale(1.02);
        }

        /* SUGGESTIONS */
        .suggestions-container {
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            background: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            z-index: 200;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.85rem;
            color: #1a2a3a;
        }

        .suggestion-item:hover {
            background: #4ade80;
            color: white;
        }

        /* HISTORIQUE */
        .history-bar {
            margin: 16px 16px 0 16px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            padding-bottom: 8px;
        }

        .history-bar::-webkit-scrollbar {
            height: 4px;
        }

        .history-bar::-webkit-scrollbar-track {
            background: #e8ecf0;
            border-radius: 4px;
        }

        .history-bar::-webkit-scrollbar-thumb {
            background: #4ade80;
            border-radius: 4px;
        }

        .history-list {
            display: flex;
            gap: 8px;
        }

        .history-chip {
            background: #e0e5ec;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2e7d32;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
        }

        .history-chip:hover {
            background: #4ade80;
            color: white;
            transform: translateY(-2px);
        }

            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;

<body>

    <header class="main-header">
        <a href="market-new.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="search-container" style="position: relative;">

        </div>

    </header>

    <div id="historyBar" class="history-bar" style="display: none;">
        <div class="history-list" id="historyList"></div>
    </div>

    <div id="initialState" class="empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh;">
        <i class="fas fa-search" style="font-size: 3rem; color: #4ade80; margin-bottom: 16px;"></i>
        <h3>🔍 Recherche de produits</h3>
        <p>Tapez un ou plusieurs mots et appuyez sur OK</p>
    </div>

    <div id="resultsContainer" class="results-container" style="display: none;">
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const toastEl = document.getElementById('toast');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const historyBar = document.getElementById('historyBar');
            const historyList = document.getElementById('historyList');
            const initialState = document.getElementById('initialState');
            const resultsContainer = document.getElementById('resultsContainer');
            const productsGrid = document.getElementById('productsGrid');
            const suggestionsContainer = document.getElementById('suggestionsContainer');

            let allProducts = [];
            let allMarkets = [];
            let productBoosts = {};
            let productViews = {};
            let searchHistory = [];
            let currentUserId = null;
            let currentUserVerified = false;
            let isDataLoaded = false;
            const STORAGE_KEY = 'megane_search_history';
            const CACHE_KEY = 'megane_search_cache';
            const CACHE_TIMESTAMP_KEY = 'megane_search_timestamp';

            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = `toast ${type} show`;
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            }

            // NOUVELLE FONCTION : Vérifie la session sans rediriger
            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    currentUserId = null;
                    currentUserVerified = false;
                    return false;
                }
                currentUserId = session.user.id;
                const { data: verifData } = await supabase
                    .from('email_verifications')
                    .select('is_verified')
                    .eq('user_id', currentUserId)
                    .single();
                currentUserVerified = verifData?.is_verified === true;
                return true;
            }

            function saveToCache() {
                const cacheData = {
                    allProducts: allProducts,
                    allMarkets: allMarkets,
                    productBoosts: productBoosts,
                    productViews: productViews,
                    timestamp: Date.now()
                };
                sessionStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
                sessionStorage.setItem(CACHE_TIMESTAMP_KEY, Date.now().toString());
            }

            function loadFromCache() {
                const cached = sessionStorage.getItem(CACHE_KEY);
                const timestamp = sessionStorage.getItem(CACHE_TIMESTAMP_KEY);
                if (cached && timestamp && (Date.now() - parseInt(timestamp)) < 300000) {
                    try {
                        const data = JSON.parse(cached);
                        allProducts = data.allProducts || [];
                        allMarkets = data.allMarkets || [];
                        productBoosts = data.productBoosts || {};
                        productViews = data.productViews || {};
                        isDataLoaded = true;
                        return true;
                    } catch(e) {}
                }
                return false;
            }

            async function loadProductBoosts() {
                const { data } = await supabase
                    .from('product_boosts')
                    .select('product_id, discount_percent')
                    .eq('is_active', true);
                productBoosts = {};
                for (const boost of data || []) {
                    if (boost.discount_percent > 0) {
                        productBoosts[boost.product_id] = boost.discount_percent;
                    }
                }
            }

            async function loadProductViews() {
                const { data } = await supabase
                    .from('product_stats')
                    .select('product_id, view_count');
                productViews = {};
                for (const stat of data || []) {
                    productViews[stat.product_id] = (productViews[stat.product_id] || 0) + (stat.view_count || 0);
                }
            }

            async function loadMarkets() {
                const { data } = await supabase
                    .from('markets')
                    .select('id, market_name, owner_name');
                allMarkets = data || [];
            }

            function getMarketName(marketId) {
                const market = allMarkets.find(m => m.id === marketId);
                return market?.market_name || market?.owner_name || 'Vendeur';
            }

            function loadHistory() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    searchHistory = JSON.parse(saved);
                }
                renderHistory();
            }

            function saveHistory() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(searchHistory));
            }

            function addToHistory(query) {
                if (!query.trim()) return;
                searchHistory = searchHistory.filter(h => h !== query);
                searchHistory.unshift(query);
                if (searchHistory.length > 10) searchHistory.pop();
                saveHistory();
                renderHistory();
            }

            function renderHistory() {
                if (searchHistory.length === 0) {
                    historyBar.style.display = 'none';
                    return;
                }
                historyBar.style.display = 'block';
                historyList.innerHTML = searchHistory.map(term => `
                    <button class="history-chip" data-term="${escapeHtml(term)}">${escapeHtml(term)}</button>
                `).join('');
                document.querySelectorAll('.history-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const term = chip.getAttribute('data-term');
                        searchInput.value = term;
                        performSearch(term);
                        hideSuggestions();
                    });
                });
            }

            async function loadProducts() {
                const { data: products } = await supabase
                    .from('products')
                    .select('*')
                    .eq('active', true);
                allProducts = products || [];
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('fr-FR').format(price);
            }

            function getSuggestions(query) {
                if (!query.trim()) return [];
                const lowerQuery = query.toLowerCase();
                return allProducts
                    .filter(p => p.name.toLowerCase().startsWith(lowerQuery))
                    .slice(0, 8)
                    .map(p => p.name);
            }

            function showSuggestions(suggestions) {
                if (suggestions.length === 0) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }
                suggestionsContainer.innerHTML = suggestions.map(s => `
                    <div class="suggestion-item" data-term="${escapeHtml(s)}">${escapeHtml(s)}</div>
                `).join('');
                suggestionsContainer.style.display = 'block';
                document.querySelectorAll('.suggestion-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const term = item.getAttribute('data-term');
                        searchInput.value = term;
                        performSearch(term);
                        hideSuggestions();
                    });
                });
            }

            function hideSuggestions() {
                suggestionsContainer.style.display = 'none';
            }

            function searchProducts(query) {
                if (!query.trim()) return [];
                const searchLower = query.toLowerCase().trim();
                return allProducts.filter(product => 
                    product.name.toLowerCase().includes(searchLower) ||
                    (product.description && product.description.toLowerCase().includes(searchLower)) ||
                    (product.category && product.category.toLowerCase().includes(searchLower))
                );
            }

            async function getTopViewedProducts(limit = 8) {
                const sorted = [...allProducts].sort((a, b) => {
                    const viewsA = productViews[a.id] || 0;
                    const viewsB = productViews[b.id] || 0;
                    return viewsB - viewsA;
                });
                return sorted.slice(0, limit);
            }

            function getRandomCardType() {
                const cards = ['card2', 'card7'];
                return cards[Math.floor(Math.random() * cards.length)];
            }

            function renderProductCard(product, cardType, isPromo = false) {
                const discount = productBoosts[product.id] || 0;
                const originalPrice = product.price;
                const discountedPrice = discount > 0 ? Math.round(originalPrice * (1 - discount / 100)) : originalPrice;
                const imageUrl = product.images && product.images[0] ? product.images[0] : null;
                const views = productViews[product.id] || 0;
                const marketName = getMarketName(product.user_id);

                if (isPromo || discount > 0) {
                    return `
                        <div class="card12" data-id="${product.id}">
                            <div class="img-wrap">
                                ${imageUrl 
                                    ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name)}" onerror="this.src=''">`
                                    : `<div class="image-placeholder"><i class="fas fa-image"></i></div>`
                                }
                            </div>
                            <div class="name">${escapeHtml(product.name)}</div>
                            <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                            <div class="views"><i class="fas fa-eye"></i> ${views} vues</div>
                            <div class="price">${formatPrice(discountedPrice)} FCFA</div>
                            <div class="btn-row">
                                <button class="btn view">Voir</button>
                                <button class="btn cart">Ajouter</button>
                            </div>
                        </div>
                    `;
                }

                if (cardType === 'card2') {
                    return `
                        <div class="card2" data-id="${product.id}">
                            <div class="top-bar"></div>
                            <div class="img-wrap">
                                ${imageUrl 
                                    ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name)}" onerror="this.src=''">`
                                    : `<div class="image-placeholder"><i class="fas fa-image"></i></div>`
                                }
                            </div>
                            <div class="body">
                                <div class="name">${escapeHtml(product.name)}</div>
                                <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                                <div class="views"><i class="fas fa-eye"></i> ${views} vues</div>
                                <div class="price">${formatPrice(originalPrice)} FCFA</div>
                                <div class="btn-row">
                                    <button class="btn view">Voir</button>
                                    <button class="btn cart">Ajouter</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="card7" data-id="${product.id}">
                            <div class="img-wrap">
                                ${imageUrl 
                                    ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name)}" onerror="this.src=''">`
                                    : `<div class="image-placeholder"><i class="fas fa-image"></i></div>`
                                }
                                <div class="heart"><i class="fas fa-heart"></i></div>
                            </div>
                            <div class="body">
                                <div class="name">${escapeHtml(product.name)}</div>
                                <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                                <div class="price">${formatPrice(originalPrice)} FCFA</div>
                                <div class="btn-row">
                                    <button class="btn view">Voir</button>
                                    <button class="btn cart">Ajouter</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            function renderNoResults() {
                productsGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-search"></i>
                        <h3>Aucun résultat trouvé</h3>
                        <p>Essayez avec d'autres mots-clés</p>
                    </div>
                `;
            }

            async function renderTopProducts() {
                const topProducts = await getTopViewedProducts(8);
                productsGrid.innerHTML = topProducts.map(product => {
                    const discount = productBoosts[product.id] || 0;
                    const originalPrice = product.price;
                    const discountedPrice = discount > 0 ? Math.round(originalPrice * (1 - discount / 100)) : originalPrice;
                    const imageUrl = product.images && product.images[0] ? product.images[0] : null;
                    const views = productViews[product.id] || 0;
                    const marketName = getMarketName(product.user_id);
                    
                    return `
                        <div class="card16" data-id="${product.id}">
                            <div class="img-wrap">
                                ${imageUrl 
                                    ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(product.name)}" onerror="this.src=''">`
                                    : `<div class="image-placeholder"><i class="fas fa-image"></i></div>`
                                }
                                <div class="badge">TOP ${views} vues</div>
                            </div>
                            <div class="body">
                                <div class="name">${escapeHtml(product.name)}</div>
                                <div class="shop"><i class="fas fa-store"></i> ${escapeHtml(marketName)}</div>
                                <div class="views"><i class="fas fa-eye"></i> ${views} vues</div>
                                <div class="price">${discount > 0 ? formatPrice(discountedPrice) : formatPrice(originalPrice)} FCFA</div>
                                <div class="btn-row">
                                    <button class="btn view">Voir</button>
                                    <button class="btn cart">Ajouter</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function bindCardEvents() {
                document.querySelectorAll('.card2, .card7, .card12, .card16').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.classList.contains('btn')) return;
                        const id = card.getAttribute('data-id');
                        if (id) window.location.href = `viewproduct.html?id=${id}`;
                    });
                });
                
                document.querySelectorAll('.btn.view').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const card = btn.closest('[data-id]');
                        const id = card.getAttribute('data-id');
                        if (id) window.location.href = `viewproduct.html?id=${id}`;
                    });
                });
                
                document.querySelectorAll('.btn.cart').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const card = btn.closest('[data-id]');
                        const productId = card.getAttribute('data-id');
                        if (productId && currentUserId && currentUserVerified) {
                            await addToCart(productId);
                        } else if (!currentUserId) {
                            showToast('Connectez-vous pour ajouter au panier', 'error');
                            window.location.href = 'login.html';
                        } else if (!currentUserVerified) {
                            showToast('Vérifiez votre email pour ajouter au panier', 'error');
                            window.location.href = 'email-verify.html';
                        }
                    });
                });
            }

            async function renderResults(products, query) {
                if (products.length === 0) {
                    renderNoResults();
                    setTimeout(async () => {
                        await renderTopProducts();
                        bindCardEvents();
                    }, 100);
                    return;
                }
                productsGrid.innerHTML = products.map(product => {
                    const hasPromo = (productBoosts[product.id] || 0) > 0;
                    const cardType = getRandomCardType();
                    return renderProductCard(product, cardType, hasPromo);
                }).join('');
                bindCardEvents();
                saveToCache();
            }

            async function addToCart(productId) {
                try {
                    const { data: existing } = await supabase
                        .from('cart')
                        .select('id, quantity')
                        .eq('user_id', currentUserId)
                        .eq('product_id', productId)
                        .maybeSingle();
                    
                    if (existing) {
                        await supabase.from('cart').update({ quantity: existing.quantity + 1 }).eq('id', existing.id);
                        showToast('Quantité augmentée', 'success');
                    } else {
                        await supabase.from('cart').insert({ user_id: currentUserId, product_id: productId, quantity: 1 });
                        showToast('Produit ajouté au panier', 'success');
                    }
                } catch (err) {
                    showToast('Erreur', 'error');
                }
            }

            function performSearch(forcedQuery = null) {
                const query = forcedQuery !== null ? forcedQuery : searchInput.value.trim();
                if (!query) {
                    initialState.style.display = 'flex';
                    resultsContainer.style.display = 'none';
                    hideSuggestions();
                    return;
                }
                addToHistory(query);
                const results = searchProducts(query);
                initialState.style.display = 'none';
                resultsContainer.style.display = 'block';
                renderResults(results, query);
                hideSuggestions();
            }

            async function loadAllData() {
                if (loadFromCache()) {
                    return true;
                }
                await loadProducts();
                await loadMarkets();
                await loadProductBoosts();
                await loadProductViews();
                saveToCache();
                return true;
            }

            searchBtn.addEventListener('click', () => performSearch());
            searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (query.length > 0) {
                    const suggestions = getSuggestions(query);
                    showSuggestions(suggestions);
                } else {
                    hideSuggestions();
                }
            });
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
                    hideSuggestions();
                }
            });

            async function init() {
                await checkSession();
                await loadAllData();
                loadHistory();
            }
            init();
        })();
    </script>
</body>
</html>
