<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Détail produit - Megane Market</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0f2f5;
            color: #1a2a3a;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* HEADER NÉOMORPHIQUE VERT */
        .main-header {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 60px;
            height: 60px;
            border: none;
            margin: 16px 16px 0 16px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .back-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .market-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .market-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 3px 3px 6px #9bb8a8, -3px -3px 6px #f0fff4;
        }

        .market-logo-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e5ec;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e7d32;
            font-size: 1rem;
            box-shadow: 3px 3px 6px #9bb8a8, -3px -3px 6px #f0fff4;
        }

        .market-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #2e7d32;
        }

        .cart-btn {
            background: #e0e5ec;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2e7d32;
            box-shadow: 5px 5px 10px #9bb8a8, -5px -5px 10px #f0fff4;
            transition: all 0.2s;
            position: relative;
        }

        .cart-btn:hover {
            background: #4ade80;
            color: white;
            transform: scale(1.05);
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4d4d;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARTE IMAGE NÉOMORPHIQUE VERTE */
        .image-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .image-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .image-header span {
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a3a1a;
        }

        .image-count {
            background: #ff4d4d;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* CARROUSEL */
        .carousel-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            background: rgba(255,255,255,0.3);
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel-slide {
            flex: 0 0 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-slide .image-placeholder {
            font-size: 4rem;
            color: #2e7d32;
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
            z-index: 10;
        }

        .carousel-nav:hover {
            background: #4ade80;
        }

        .carousel-nav.prev {
            left: 12px;
        }

        .carousel-nav.next {
            right: 12px;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(46, 125, 50, 0.4);
            cursor: pointer;
            transition: all 0.2s;
        }

        .carousel-dot.active {
            background: #4ade80;
            width: 24px;
            border-radius: 4px;
        }

        /* CARTE INFO PRODUIT NÉOMORPHIQUE */
        .info-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .info-title {
            font-size: 1rem;
            font-weight: 800;
            color: #1a3a1a;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .info-row-2cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .info-box-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #2e7d32;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-box-value {
            font-weight: 800;
            font-size: 1rem;
            color: #1a3a1a;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .price-old {
            font-size: 0.75rem;
            color: #6a8a6a;
            text-decoration: line-through;
        }

        .price-current {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ff4d4d;
        }

        .price-normal {
            font-size: 1.1rem;
            font-weight: 800;
            color: #2e7d32;
        }

        .stock-card {
            background: #ff4d4d;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .stock-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .stock-item i {
            font-size: 1rem;
        }

        /* BANNIÈRE DESCRIPTION DÉPLIABLE */
        .description-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .description-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 4px 0;
        }

        .description-header h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .description-header i {
            font-size: 0.9rem;
            color: #2e7d32;
            transition: transform 0.3s ease;
        }

        .description-header i.rotated {
            transform: rotate(180deg);
        }

        .description-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .description-content.open {
            max-height: 500px;
            margin-top: 12px;
        }

        .description-text {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #1a3a1a;
            padding: 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
        }

        .description-close-btn {
            margin-top: 10px;
            text-align: center;
        }

        .close-desc-btn {
            background: rgba(255, 255, 255, 0.6);
            border: none;
            border-radius: 40px;
            padding: 6px 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2e7d32;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-desc-btn:hover {
            background: #4ade80;
            color: white;
        }

        /* CARTE INFORMATIONS COMPLÉMENTAIRES */
        .complementary-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .complementary-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .complementary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .comp-item {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 10px;
        }

        .comp-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #2e7d32;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .comp-value {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a3a1a;
            word-break: break-word;
        }

        /* CARTE CARACTÉRISTIQUES */
        .features-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
        }

        .features-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.2);
        }

        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            padding: 10px;
        }

        .feature-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: #2e7d32;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .feature-value {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a3a1a;
            word-break: break-word;
        }

        /* BANNIÈRE GARANTIE */
        .warranty-card {
            background: linear-gradient(135deg, #d4efdf, #b8e0c2);
            border-radius: 24px;
            margin: 20px 16px;
            padding: 16px;
            box-shadow: 9px 9px 16px #9bb8a8, -9px -9px 16px #f0fff4;
            text-align: center;
        }

        .warranty-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #1a3a1a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .warranty-value {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2e7d32;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 40px;
            display: inline-block;
            padding-left: 20px;
            padding-right: 20px;
        }

        .loader {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e8ecf0;
            border-top-color: #4ade80;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a2a3a;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .carousel-nav {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
            .info-row-2cols {
                gap: 12px;
            }
            .info-box-value {
                font-size: 0.85rem;
            }
            .stock-item {
                font-size: 0.7rem;
            }
            .complementary-grid, .features-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <button id="backBtn" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div id="marketInfo" class="market-info">
            <div class="market-logo-placeholder" id="marketLogo">
                <i class="fas fa-store"></i>
            </div>
            <span id="marketName" class="market-name">Chargement...</span>
        </div>
        <button id="cartHeaderBtn" class="cart-btn" title="Ajouter au panier">
            <i class="fas fa-cart-plus"></i>
            <span id="cartHeaderBadge" class="cart-badge" style="display: none;">0</span>
        </button>
    </header>

    <main id="mainContent">
        <div class="loader">
            <div class="spinner"></div>
            <p>Chargement du produit...</p>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://emcsigvlopntwbfkkjkh.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtY3NpZ3Zsb3BudHdiZmtramtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODE5MTgsImV4cCI6MjA5NDQ1NzkxOH0.YwYoV-azL3WEFtHoh4yoF7xTLrOwZILKCzJrGPsCs6I';

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const mainContent = document.getElementById('mainContent');
            const toastEl = document.getElementById('toast');
            const backBtn = document.getElementById('backBtn');
            const marketLogo = document.getElementById('marketLogo');
            const marketNameSpan = document.getElementById('marketName');
            const cartHeaderBtn = document.getElementById('cartHeaderBtn');
            const cartHeaderBadge = document.getElementById('cartHeaderBadge');

            let currentProduct = null;
            let currentMarket = null;
            let currentImages = [];
            let currentImageIndex = 0;
            let carouselInterval = null;
            let productBoosts = null;
            let productViews = 0;
            let currentUserId = null;

            function showToast(message, type = 'info') {
                toastEl.textContent = message;
                toastEl.className = `toast ${type} show`;
                setTimeout(() => toastEl.classList.remove('show'), 3000);
            }

            function getProductId() {
                const params = new URLSearchParams(window.location.search);
                return params.get('id');
            }

            backBtn.addEventListener('click', () => {
                window.history.back();
            });

            async function checkSession() {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUserId = session.user.id;
                }
            }

            async function recordProductView(productId) {
                try {
                    await supabase
                        .from('product_stats')
                        .insert({
                            product_id: productId,
                            view_count: 1,
                            viewed_at: new Date().toISOString()
                        });
                    console.log('Vue enregistrée pour le produit:', productId);
                } catch (err) {
                    console.error('Erreur enregistrement vue:', err);
                }
            }

            async function loadProductViews(productId) {
                const { data } = await supabase
                    .from('product_stats')
                    .select('view_count')
                    .eq('product_id', productId);
                let total = 0;
                for (const stat of data || []) {
                    total += stat.view_count || 0;
                }
                productViews = total;
            }

            async function loadProductBoost(productId) {
                const { data } = await supabase
                    .from('product_boosts')
                    .select('*')
                    .eq('product_id', productId)
                    .eq('is_active', true)
                    .single();
                productBoosts = data;
            }

            async function addToCartFromHeader() {
                if (!currentUserId) {
                    showToast('Connectez-vous pour ajouter au panier', 'error');
                    window.location.href = 'login.html';
                    return;
                }
                
                if (!currentProduct) return;
                
                try {
                    const { data: existing } = await supabase
                        .from('cart')
                        .select('id, quantity')
                        .eq('user_id', currentUserId)
                        .eq('product_id', currentProduct.id)
                        .maybeSingle();
                    
                    if (existing) {
                        const { error } = await supabase
                            .from('cart')
                            .update({ quantity: existing.quantity + 1 })
                            .eq('id', existing.id);
                        if (error) throw error;
                        showToast('Quantité augmentée dans le panier', 'success');
                    } else {
                        const { error } = await supabase
                            .from('cart')
                            .insert({
                                user_id: currentUserId,
                                product_id: currentProduct.id,
                                quantity: 1
                            });
                        if (error) throw error;
                        showToast('Produit ajouté au panier', 'success');
                    }
                    
                    await updateCartBadge();
                    
                } catch (err) {
                    console.error(err);
                    showToast('Erreur lors de l\'ajout', 'error');
                }
            }

            async function updateCartBadge() {
                if (!currentUserId) {
                    cartHeaderBadge.style.display = 'none';
                    return;
                }
                const { data, error } = await supabase
                    .from('cart')
                    .select('id', { count: 'exact', head: true })
                    .eq('user_id', currentUserId);
                if (!error && data !== null) {
                    const count = data.length || 0;
                    if (count > 0) {
                        cartHeaderBadge.textContent = count;
                        cartHeaderBadge.style.display = 'flex';
                    } else {
                        cartHeaderBadge.style.display = 'none';
                    }
                }
            }

            cartHeaderBtn.addEventListener('click', addToCartFromHeader);

            function initCarousel() {
                const track = document.getElementById('carouselTrack');
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                const dotsContainer = document.getElementById('carouselDots');
                
                if (!track || currentImages.length <= 1) return;
                
                const totalSlides = currentImages.length;
                
                dotsContainer.innerHTML = currentImages.map((_, i) => `
                    <div class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>
                `).join('');
                
                function goToSlide(index) {
                    currentImageIndex = (index + totalSlides) % totalSlides;
                    track.style.transform = `translateX(-${currentImageIndex * 100}%)`;
                    document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                        dot.classList.toggle('active', i === currentImageIndex);
                    });
                }
                
                function nextSlide() { goToSlide(currentImageIndex + 1); resetTimer(); }
                function prevSlide() { goToSlide(currentImageIndex - 1); resetTimer(); }
                
                function resetTimer() {
                    if (carouselInterval) clearInterval(carouselInterval);
                    carouselInterval = setInterval(nextSlide, 4000);
                }
                
                prevBtn.addEventListener('click', prevSlide);
                nextBtn.addEventListener('click', nextSlide);
                document.querySelectorAll('.carousel-dot').forEach(dot => {
                    dot.addEventListener('click', () => {
                        goToSlide(parseInt(dot.dataset.index));
                        resetTimer();
                    });
                });
                
                resetTimer();
            }

            function renderImageCard() {
                const imageCount = currentImages.length;
                
                let carouselHtml = '';
                if (currentImages.length > 0) {
                    carouselHtml = `
                        <div class="carousel-container">
                            <div class="carousel-track" id="carouselTrack">
                                ${currentImages.map(img => `
                                    <div class="carousel-slide">
                                        <img src="${escapeHtml(img)}" alt="${escapeHtml(currentProduct.name)}" onerror="this.src=''">
                                    </div>
                                `).join('')}
                            </div>
                            ${currentImages.length > 1 ? `
                                <button class="carousel-nav prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                                <button class="carousel-nav next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
                                <div class="carousel-dots" id="carouselDots"></div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    carouselHtml = `
                        <div class="carousel-container">
                            <div class="carousel-slide">
                                <div class="image-placeholder"><i class="fas fa-image"></i></div>
                            </div>
                        </div>
                    `;
                }
                
                return `
                    <div class="image-card">
                        <div class="image-header">
                            <span><i class="fas fa-images"></i> Photos du produit</span>
                            <span class="image-count">${imageCount} photo${imageCount > 1 ? 's' : ''}</span>
                        </div>
                        ${carouselHtml}
                    </div>
                `;
            }

            function renderInfoCard() {
                const discount = productBoosts?.discount_percent || 0;
                const originalPrice = currentProduct.price;
                const discountedPrice = discount > 0 ? Math.round(originalPrice * (1 - discount / 100)) : originalPrice;
                const stock = currentProduct.stock;
                const brand = currentProduct.brand || 'Non spécifiée';
                
                return `
                    <div class="info-card">
                        <div class="info-title">${escapeHtml(currentProduct.name)}</div>
                        <div class="info-row-2cols">
                            <div class="info-box">
                                <div class="info-box-label">Prix</div>
                                <div class="info-box-value">
                                    ${discount > 0 ? `
                                        <div class="price-row">
                                            <span class="price-old">${formatPrice(originalPrice)} FCFA</span>
                                            <span class="price-current">${formatPrice(discountedPrice)} FCFA</span>
                                            <span style="background:#ff4d4d; color:white; font-size:0.6rem; padding:2px 6px; border-radius:20px;">-${discount}%</span>
                                        </div>
                                    ` : `
                                        <div class="price-row">
                                            <span class="price-normal">${formatPrice(originalPrice)} FCFA</span>
                                        </div>
                                    `}
                                </div>
                            </div>
                            <div class="info-box">
                                <div class="info-box-label">Marque</div>
                                <div class="info-box-value">${escapeHtml(brand)}</div>
                            </div>
                        </div>
                        <div class="stock-card">
                            <div class="stock-item">
                                <i class="fas fa-boxes"></i>
                                <span>Stock: ${stock !== null && stock !== undefined ? stock + ' unités' : 'Non renseigné'}</span>
                            </div>
                            <div class="stock-item">
                                <i class="fas fa-eye"></i>
                                <span>${productViews} vues</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderDescriptionCard() {
                const description = currentProduct.description;
                if (!description || description.trim() === '') {
                    return '';
                }
                
                return `
                    <div class="description-card" id="descriptionCard">
                        <div class="description-header" id="descriptionHeader">
                            <h3><i class="fas fa-align-left"></i> Description du produit</h3>
                            <i class="fas fa-chevron-down" id="descArrow"></i>
                        </div>
                        <div class="description-content" id="descriptionContent">
                            <div class="description-text">${escapeHtml(description)}</div>
                            <div class="description-close-btn">
                                <button class="close-desc-btn" id="closeDescBtn">Fermer</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderComplementaryCard() {
                const category = currentProduct.category || 'Non spécifiée';
                const condition = currentProduct.condition || 'Non spécifié';
                const sku = currentProduct.sku || 'Non renseignée';
                const priceOption = currentProduct.price_option || 'Prix fixe';
                
                return `
                    <div class="complementary-card">
                        <div class="complementary-title">
                            <i class="fas fa-info-circle"></i> Informations complémentaires
                        </div>
                        <div class="complementary-grid">
                            <div class="comp-item">
                                <div class="comp-label"><i class="fas fa-tag"></i> Catégorie</div>
                                <div class="comp-value">${escapeHtml(category)}</div>
                            </div>
                            <div class="comp-item">
                                <div class="comp-label"><i class="fas fa-clipboard-list"></i> État</div>
                                <div class="comp-value">${escapeHtml(condition)}</div>
                            </div>
                            <div class="comp-item">
                                <div class="comp-label"><i class="fas fa-barcode"></i> Référence SKU</div>
                                <div class="comp-value">${escapeHtml(sku)}</div>
                            </div>
                            <div class="comp-item">
                                <div class="comp-label"><i class="fas fa-comment-dollar"></i> Option prix</div>
                                <div class="comp-value">${escapeHtml(priceOption)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderFeaturesCard() {
                const colors = currentProduct.colors || 'Non renseignées';
                const sizes = currentProduct.sizes || 'Non renseignées';
                const weight = currentProduct.weight ? currentProduct.weight + ' kg' : 'Non renseigné';
                const origin = currentProduct.origin || 'Non renseignée';
                
                return `
                    <div class="features-card">
                        <div class="features-title">
                            <i class="fas fa-palette"></i> Caractéristiques
                        </div>
                        <div class="features-grid">
                            <div class="feature-item">
                                <div class="feature-label"><i class="fas fa-fill-drip"></i> Couleurs</div>
                                <div class="feature-value">${escapeHtml(colors)}</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-label"><i class="fas fa-ruler-combined"></i> Tailles</div>
                                <div class="feature-value">${escapeHtml(sizes)}</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-label"><i class="fas fa-weight-hanging"></i> Poids</div>
                                <div class="feature-value">${escapeHtml(weight)}</div>
                            </div>
                            <div class="feature-item">
                                <div class="feature-label"><i class="fas fa-globe-africa"></i> Origine</div>
                                <div class="feature-value">${escapeHtml(origin)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderWarrantyCard() {
                const warranty = currentProduct.warranty || 'Non renseignée';
                
                if (warranty === 'Non renseignée') {
                    return '';
                }
                
                return `
                    <div class="warranty-card">
                        <div class="warranty-title">
                            <i class="fas fa-shield-alt"></i> Garantie
                        </div>
                        <div class="warranty-value">
                            <i class="fas fa-check-circle"></i> ${escapeHtml(warranty)}
                        </div>
                    </div>
                `;
            }

            function initDescriptionToggle() {
                const header = document.getElementById('descriptionHeader');
                const content = document.getElementById('descriptionContent');
                const arrow = document.getElementById('descArrow');
                const closeBtn = document.getElementById('closeDescBtn');
                
                if (!header || !content) return;
                
                function openDesc() {
                    content.classList.add('open');
                    if (arrow) arrow.classList.add('rotated');
                }
                
                function closeDesc() {
                    content.classList.remove('open');
                    if (arrow) arrow.classList.remove('rotated');
                }
                
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (content.classList.contains('open')) {
                        closeDesc();
                    } else {
                        openDesc();
                    }
                });
                
                if (closeBtn) {
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        closeDesc();
                    });
                }
            }

            function formatPrice(price) {
                return new Intl.NumberFormat('fr-FR').format(price);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function loadProduct() {
                const id = getProductId();
                if (!id) {
                    mainContent.innerHTML = '<div class="loader"><p>Produit non trouvé</p></div>';
                    return;
                }

                try {
                    const { data: product, error } = await supabase
                        .from('products')
                        .select('*')
                        .eq('id', id)
                        .single();

                    if (error || !product) throw new Error('Produit non trouvé');

                    currentProduct = product;
                    currentImages = (product.images || []).filter(Boolean);

                    const { data: market, error: marketError } = await supabase
                        .from('markets')
                        .select('id, market_name, owner_name, avatar_url')
                        .eq('id', product.user_id)
                        .single();

                    if (marketError) throw marketError;
                    currentMarket = market;

                    await loadProductBoost(product.id);
                    await loadProductViews(product.id);
                    await checkSession();
                    await updateCartBadge();

                    // Mettre à jour le header
                    if (currentMarket.avatar_url) {
                        marketLogo.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = currentMarket.avatar_url;
                        img.className = 'market-logo';
                        img.alt = currentMarket.market_name || currentMarket.owner_name;
                        img.onerror = () => {
                            marketLogo.innerHTML = '<i class="fas fa-store"></i>';
                            marketLogo.className = 'market-logo-placeholder';
                        };
                        marketLogo.appendChild(img);
                        marketLogo.classList.remove('market-logo-placeholder');
                    } else {
                        marketLogo.innerHTML = '<i class="fas fa-store"></i>';
                        marketLogo.className = 'market-logo-placeholder';
                    }
                    marketNameSpan.textContent = currentMarket.market_name || currentMarket.owner_name || 'Vendeur';

                    // Afficher les cartes
                    mainContent.innerHTML = renderImageCard() + renderInfoCard() + renderDescriptionCard() + renderComplementaryCard() + renderFeaturesCard() + renderWarrantyCard();

                    // Initialiser le carrousel si plusieurs images
                    if (currentImages.length > 1) {
                        setTimeout(initCarousel, 100);
                    }

                    // Initialiser la description dépliable
                    setTimeout(initDescriptionToggle, 100);

                    // Enregistrer la vue
                    await recordProductView(product.id);

                } catch (err) {
                    console.error(err);
                    mainContent.innerHTML = `<div class="loader"><p>Erreur: ${err.message}</p></div>`;
                    showToast('Erreur chargement', 'error');
                }
            }

            loadProduct();
        })();
    </script>
</body>
</html>
